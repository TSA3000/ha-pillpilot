mark_taken:
  name: Mark medicine as taken
  description: Record that a dose has been taken.
  fields:
    medicine_id:
      name: Medicine ID
      description: The internal id of the medicine (see sensor attributes).
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    person_id:
      name: Person
      description: "Optional. For multi-prescription medicines (one drug, multiple people in the household), pin this action to a specific person's prescription. Pass the person entity id (e.g. person.sam) or omit for household / single-prescription medicines."
      required: false
      example: "person.sam"
      selector:
        entity:
          domain: person
    when:
      name: When
      description: Timestamp of when it was taken. Defaults to now.
      required: false
      example: "2026-05-04T08:05:00+02:00"
      selector:
        datetime:
    scheduled_for:
      name: Scheduled for
      description: Which scheduled slot this action belongs to. Use this when a medicine has multiple times per day to pin the action to a specific slot. Defaults to the closest scheduled time.
      required: false
      example: "2026-05-04T08:00:00+02:00"
      selector:
        datetime:

skip:
  name: Skip dose
  description: Mark the current scheduled dose as skipped.
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    person_id:
      name: Person
      description: "Optional. For multi-prescription medicines, pin this skip to a specific person's prescription."
      required: false
      example: "person.sam"
      selector:
        entity:
          domain: person
    scheduled_for:
      name: Scheduled for
      description: Which scheduled slot to skip. Use this when a medicine has multiple times per day. Defaults to the closest scheduled time.
      required: false
      example: "2026-05-04T08:00:00+02:00"
      selector:
        datetime:

snooze:
  name: Snooze reminder
  description: Defer a scheduled dose by N minutes — the integration re-fires pillpilot_dose_due when the snooze elapses, so notifications hooked up to that event ring again. EVENT_DOSE_MISSED is suppressed for any slot that's been snoozed.
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    person_id:
      name: Person
      description: "Optional. For multi-prescription medicines, pin this snooze to a specific person's prescription."
      required: false
      example: "person.sam"
      selector:
        entity:
          domain: person
    scheduled_for:
      name: Scheduled for
      description: Which scheduled slot to snooze. Use this when a medicine has multiple times per day. Defaults to the closest scheduled time.
      required: false
      example: "2026-05-04T08:00:00+02:00"
      selector:
        datetime:
    minutes:
      name: Minutes
      required: true
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

unmark_taken:
  name: Unmark dose as taken
  description: Remove the most recent "taken" record for a medicine — the inverse of mark_taken. Used by the panel's hover-undo and bulk Undo. The fired pillpilot_dose_unmarked event lets automations roll back any side-effects of a previous pillpilot_dose_taken.
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    person_id:
      name: Person
      description: "Optional. For multi-prescription medicines, restrict the undo to records for a specific person's prescription."
      required: false
      example: "person.sam"
      selector:
        entity:
          domain: person
    scheduled_for:
      name: Scheduled for
      description: Which scheduled slot to undo. Use this when the medicine has multiple times per day. Defaults to the most recent taken record regardless of slot.
      required: false
      example: "2026-05-04T07:00:00+02:00"
      selector:
        datetime:

refresh_medicines_database:
  name: Refresh medicines database
  description: Pull a fresh copy of medicines_se.json from the configured URL (or from a URL passed to the call). Updates the autocomplete dropdown the next time the Add Medicine form is opened.
  fields:
    url:
      name: URL override
      description: Optional. If omitted, uses the URL configured in the integration. Pass it here to test a different fork without changing settings.
      required: false
      example: "https://raw.githubusercontent.com/TSA3000/ha-pillpilot/main/custom_components/pillpilot/medicines_se.json"
      selector:
        text:

backfill_from_catalog:
  name: Backfill from catalog
  description: Walk every configured medicine and fill any empty NPL ID and ATC code from the bundled catalog by matching on the medicine name. Never overwrites values you've already entered. Catches up medicines added before automatic catalog auto-fill landed.

mark_taken_bulk:
  name: Mark several doses as taken
  description: Record multiple doses as taken in one call. The panel uses this for the Take all / Take due / Take missed buttons — one backend save and refresh for the whole set instead of one per dose.
  fields:
    items:
      name: Items
      description: "List of doses to mark. Each entry: medicine_id (required), scheduled_for (ISO timestamp, optional), person_id (optional)."
      required: true
      example: '[{"medicine_id": "a1b2c3", "scheduled_for": "2026-05-04T07:00:00+02:00"}]'
      selector:
        object:

snooze_bulk:
  name: Snooze several doses
  description: Snooze multiple doses by the same number of minutes in one call. Used by the panel's bulk snooze.
  fields:
    items:
      name: Items
      description: "List of doses to snooze. Each entry: medicine_id (required), scheduled_for (ISO timestamp, optional), person_id (optional)."
      required: true
      example: '[{"medicine_id": "a1b2c3", "scheduled_for": "2026-05-04T07:00:00+02:00"}]'
      selector:
        object:
    minutes:
      name: Minutes
      description: How long to snooze each dose.
      required: true
      default: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: minutes

unmark_taken_bulk:
  name: Undo several taken doses
  description: Remove the most recent taken record for multiple doses in one call. Used by the panel's bulk Undo.
  fields:
    items:
      name: Items
      description: "List of doses to undo. Each entry: medicine_id (required), scheduled_for (ISO timestamp, optional), person_id (optional)."
      required: true
      example: '[{"medicine_id": "a1b2c3", "scheduled_for": "2026-05-04T07:00:00+02:00"}]'
      selector:
        object:

configure_stock:
  name: Configure stock tracking
  description: Turn stock tracking on or off for a prescription and set its pack size, refill reminder, and expiry. Nothing stock-related is shown until track_stock is on.
  fields:
    medicine_id:
      name: Medicine ID
      description: The internal id of the medicine (see sensor attributes).
      required: true
      example: "a1b2c3d4e5f6"
      selector:
        text:
    prescription_id:
      name: Prescription ID
      description: The prescription's id (see the prescriptions list in the sensor attributes).
      required: true
      example: "9f8e7d6c5b4a"
      selector:
        text:
    track_stock:
      name: Track stock
      description: Enable or disable stock tracking for this prescription.
      required: false
      selector:
        boolean:
    pack_size:
      name: Pack size
      description: How many units one purchased pack provides (tablets per box, or injections per pen).
      required: false
      example: 30
      selector:
        number:
          min: 0
          mode: box
    reminder_enabled:
      name: Refill reminder enabled
      required: false
      selector:
        boolean:
    reminder_mode:
      name: Refill reminder mode
      description: Whether the threshold is read against units left, doses left, or days until run-out.
      required: false
      selector:
        select:
          options:
            - units
            - doses
            - days
    reminder_threshold:
      name: Refill reminder threshold
      description: Fire the low-stock event at or below this value, in the chosen mode.
      required: false
      example: 5
      selector:
        number:
          min: 0
          mode: box
    expiry:
      name: Expiry date
      description: Expiry date for the current stock (YYYY-MM-DD). Leave blank to clear.
      required: false
      example: "2026-12-31"
      selector:
        text:

set_stock:
  name: Set stock
  description: Set the absolute current stock for a prescription (a new baseline).
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    prescription_id:
      name: Prescription ID
      required: true
      selector:
        text:
    amount:
      name: Amount
      description: Current number of units in stock.
      required: true
      example: 50
      selector:
        number:
          min: 0
          mode: box
    expiry:
      name: Expiry date
      description: Optional expiry date for this stock (YYYY-MM-DD).
      required: false
      example: "2026-12-31"
      selector:
        text:

adjust_stock:
  name: Adjust stock
  description: Add to or remove from current stock by a signed amount.
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    prescription_id:
      name: Prescription ID
      required: true
      selector:
        text:
    delta:
      name: Delta
      description: Positive to add units, negative to remove.
      required: true
      example: -2
      selector:
        number:
          mode: box

refill:
  name: Refill
  description: Add one or more packs to stock. Uses the configured pack size.
  fields:
    medicine_id:
      name: Medicine ID
      required: true
      selector:
        text:
    prescription_id:
      name: Prescription ID
      required: true
      selector:
        text:
    packs:
      name: Packs
      description: How many packs were bought. Stock increases by pack size times packs.
      required: false
      example: 1
      selector:
        number:
          min: 0
          mode: box
    expiry:
      name: Expiry date
      description: Optional expiry date for the refilled stock (YYYY-MM-DD).
      required: false
      example: "2026-12-31"
      selector:
        text:
